<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulačka velikosti pozice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1621">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0e1621;--card:#16212f;--line:#263447;--tx:#e8edf3;--mut:#8b9bb0;--acc:#f0b34a;--loss:#e5645a;--gain:#4fb99f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px;font-weight:600}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.big{font-size:48px;font-weight:700;color:var(--acc);line-height:1}
.big span{font-size:18px;color:var(--mut);font-weight:500;margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.grid b{display:block;font-size:17px;margin-top:2px}
.l{font-size:12px;color:var(--mut)}
.warn{color:var(--loss);font-size:14px;margin-top:10px;min-height:20px}
.dir{display:inline-block;font-size:13px;font-weight:600;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.chips button{font:inherit;background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px}
.seg button.on{color:#0e1621;font-weight:600;border-color:transparent}
.chips{display:flex;gap:6px;margin-top:6px}
.chips button{flex:1;padding:7px 0;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Kalkulačka velikosti pozice</h1>

<section>
<div class="row">
<div><label for="bal">Kapitál účtu (Kč)</label><input id="bal" inputmode="decimal" value="100000"></div>
<div><label for="risk">Riziko na obchod (%)</label><input id="risk" inputmode="decimal" value="0.5"></div>
<div class="full chips"><button type="button" data-v="0.1">0,1</button><button type="button" data-v="0.25">0,25</button><button type="button" data-v="0.5">0,5</button><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="2.5">2,5</button></div>
<div class="full"><label for="pair">Měnový pár</label><select id="pair"></select></div>
<div class="full"><label for="rate" id="rateLbl">Kurz kotační měny k Kč</label><input id="rate" inputmode="decimal" placeholder="Zadej aktuální kurz"><small id="rateHint"></small></div>
</div>
</section>

<section>
<div class="row">
<div class="full"><label>Směr obchodu</label><div class="seg"><button type="button" id="bLong">Long (nákup)</button><button type="button" id="bShort">Short (prodej)</button></div></div>
<div><label for="entry">Vstup</label><input id="entry" inputmode="decimal" placeholder="1.08500"></div>
<div><label for="sl">Stop Loss</label><input id="sl" inputmode="decimal" placeholder="1.08200"></div>
<div class="full"><label for="tp">Take Profit (volitelné)</label><input id="tp" inputmode="decimal" placeholder="1.09100"></div>
</div>
</section>

<section>
<span class="dir" id="dir"></span>
<div class="big"><b id="lots" style="font-weight:700">–</b><span>lotů</span></div>
<div class="warn" id="warn"></div>
<div class="grid">
<div><span class="l">Skutečné riziko</span><b id="oRisk" style="color:var(--loss)">–</b></div>
<div><span class="l">Hodnota 1 pipu</span><b id="oPip">–</b></div>
<div><span class="l">Vzdálenost SL</span><b id="oSl">–</b></div>
<div><span class="l">R : R</span><b id="oRR">–</b></div>
<div class="full" style="grid-column:1/-1"><span class="l">Zisk na TP</span><b id="oProfit" style="color:var(--gain)">–</b></div>
</div>
</section>
</main>

<script>
const groups={
"Majors":["EURUSD","GBPUSD","USDJPY","USDCHF","AUDUSD","USDCAD","NZDUSD"],
"Cross páry":["EURGBP","EURJPY","EURCHF","EURAUD","EURCAD","EURNZD","GBPJPY","GBPCHF","GBPAUD","GBPCAD","GBPNZD","AUDJPY","AUDCHF","AUDCAD","AUDNZD","NZDJPY","NZDCHF","NZDCAD","CADJPY","CADCHF","CHFJPY"],
"Exotické páry":["USDMXN","USDZAR","USDTRY","USDPLN","USDHUF","USDCZK","USDNOK","USDSEK","USDDKK","USDSGD","USDHKD","USDCNH","EURPLN","EURHUF","EURCZK","EURNOK","EURSEK","EURDKK","EURTRY","EURMXN","EURZAR","GBPNOK","GBPSEK","GBPZAR","GBPPLN"]};
const $=id=>document.getElementById(id);
let dir="long";
const sel=$("pair");
for(const g in groups){const og=document.createElement("optgroup");og.label=g;
groups[g].forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p.slice(0,3)+"/"+p.slice(3);og.appendChild(o)});sel.appendChild(og)}
const num=id=>{const v=parseFloat($(id).value.replace(",","."));return isNaN(v)?0:v};
const fmt=(v,d=2)=>v.toLocaleString("cs-CZ",{minimumFractionDigits:d,maximumFractionDigits:d});

function calc(){
const pair=sel.value,q=pair.slice(3);
$("rateLbl").textContent="Kurz "+q+"/CZK";
const k=PI[pair]||1;const ph=q==="JPY"?["175.000","174.500","176.000"]:k===3?["330.000","329.000","332.000"]:k===2?["18.5000","18.4000","18.7000"]:["1.08500","1.08200","1.09100"];["entry","sl","tp"].forEach((id,i)=>$(id).placeholder=ph[i]);
const z=q==="CZK",re=$("rate");
$("rateHint").textContent=z?"Kotační měna je Kč, kurz není potřeba.":"Kolik Kč stojí 1 "+q+((q in RI&&RI[q]===0)?" (méně než 1 Kč, píš s nulou: 0153 → 0.153)":"");
if(q!==lastQ){lastQ=q;re.disabled=z;re.value=z?"1":""}
const bal=num("bal"),rp=num("risk"),rate=num("rate"),e=num("entry"),sl=num("sl"),tp=num("tp");
const out=["lots","oRisk","oPip","oSl","oRR","oProfit"];
const reset=m=>{out.forEach(i=>$(i).textContent="–");$("dir").textContent="";$("warn").textContent=m};
if(!bal||!rp||!rate||!e||!sl){reset("Vyplň kapitál, riziko, kurz, vstup a Stop Loss.");return}
if(dir==="long"?sl>=e:sl<=e){reset(dir==="long"?"U longu musí být Stop Loss pod vstupem.":"U shortu musí být Stop Loss nad vstupem.");return}
const pip=(q==="JPY"||q==="HUF")?0.01:q==="CZK"?0.001:0.0001;
const slPips=Math.abs(e-sl)/pip;
const pv=pip*100000*rate;            // Kč za 1 pip na 1 lot
const riskKc=bal*rp/100;
const raw=riskKc/(slPips*pv);
const lots=Math.floor(raw*100+1e-9)/100;
const long=dir==="long";
$("dir").textContent=long?"LONG (nákup)":"SHORT (prodej)";
$("dir").style.color=long?"var(--gain)":"var(--loss)";
$("warn").textContent=lots<0.01?"Při tomto riziku vychází teoreticky "+fmt(raw,4)+" lotu, což je pod minimem 0,01. Sniž vzdálenost SL nebo zvyš riziko.":"";
$("lots").textContent=fmt(lots);
$("oRisk").textContent=fmt(lots*slPips*pv)+" Kč";
$("oPip").textContent=fmt(lots*pv)+" Kč";
$("oSl").textContent=fmt(slPips,1)+" pips";
const tpOk=tp&&(long?tp>e:tp<e);
if(tpOk){const tpPips=Math.abs(tp-e)/pip;
$("oRR").textContent="1 : "+fmt(tpPips/slPips);
$("oProfit").textContent="+"+fmt(lots*tpPips*pv)+" Kč"}
else{$("oRR").textContent="–";$("oProfit").textContent="–";
if(tp&&lots>=0.01)$("warn").textContent="Take Profit je na špatné straně od vstupu."}
}
let lastQ="";
const RI={JPY:0,HUF:0,TRY:0,MXN:1,ZAR:1,NOK:1,SEK:1,DKK:1,PLN:1,HKD:1,CNH:1};
const PI={USDMXN:2,USDZAR:2,USDTRY:2,USDHUF:3,EURHUF:3,USDCZK:2,EURCZK:2,EURTRY:2,EURMXN:2,EURZAR:2,GBPZAR:2,USDNOK:2,EURNOK:2,GBPNOK:2,EURSEK:2,GBPSEK:2};
const pairInt=v=>{const p=sel.value;if(p.slice(3)==="JPY")return /^[12]/.test(v)?3:2;if(p==="USDSEK")return /^1/.test(v)?2:1;return PI[p]||1};
$("rate").addEventListener("input",e=>{const v=e.target.value;if(!/^\d+$/.test(v))return;const q=sel.value.slice(3),n=q in RI?RI[q]:2;e.target.value=n===0?(v[0]==="0"?(v.length>1?"0."+v.slice(1):v):"0."+v):(v.length>n?v.slice(0,n)+"."+v.slice(n):v)});
["entry","sl","tp"].forEach(id=>$(id).addEventListener("input",e=>{const v=e.target.value;if(!/^\d+$/.test(v))return;const n=pairInt(v);if(v.length>n)e.target.value=v.slice(0,n)+"."+v.slice(n)}));
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",calc));
function setDir(d){dir=d;[["bLong","long","var(--gain)"],["bShort","short","var(--loss)"]].forEach(([id,k,c])=>{const b=$(id);b.className=dir===k?"on":"";b.style.background=dir===k?c:""});calc()}
$("bLong").onclick=()=>setDir("long");$("bShort").onclick=()=>setDir("short");
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{$("risk").value=b.dataset.v;calc()});
setDir("long");
calc();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
